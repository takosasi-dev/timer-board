name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: systemd の版
        run: systemctl --version | head -1

      - name: fixture のテスト
        run: python tests/run_all.py

      # 本物の systemd で一覧が出るか。JSON と表の解析の両方で同じ結果になるかも見る。
      # --transient は sudo -n systemd-run で成功・失敗の一時タイマーを作り、最後に片付ける
      - name: 実物の systemd で確かめる
        run: python tests/check_live.py --transient
